<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0f13;
            --surface: #1a1a23;
            --surface-2: #22222e;
            --border: #2e2e3a;
            --text: #e4e4ed;
            --text-muted: #9494a8;
            --accent: #818cf8;
            --accent-dim: rgba(129, 140, 248, 0.12);
            --green: #34d399;
            --green-dim: rgba(52, 211, 153, 0.12);
            --red: #f87171;
            --red-dim: rgba(248, 113, 113, 0.12);
            --yellow: #fbbf24;
            --yellow-dim: rgba(251, 191, 36, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
        }

        /* Container */
        .container {
            max-width: 768px;
            margin: 0 auto;
            padding: 4rem 1.5rem;
        }

        /* Main Typography */
        h1, h2, h3, h4, h5, h6 {
            color: #ffffff;
            font-weight: 600;
            margin-top: 2.5rem;
            margin-bottom: 1rem;
            line-height: 1.3;
            letter-spacing: -0.02em;
        }

        h1 { font-size: 2.25rem; font-weight: 700; margin-top: 0; }
        h2 { font-size: 1.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); }
        h3 { font-size: 1.25rem; }

        p { margin-bottom: 1.25rem; color: var(--text); }
        
        strong, b { color: #ffffff; font-weight: 600; }

        /* Links */
        a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover {
            color: #a5b4fc;
            text-decoration: underline;
        }

        /* Code & Pre */
        code {
            font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            background-color: var(--surface-2);
            padding: 0.2em 0.4em;
            border-radius: 4px;
            font-size: 0.875em;
            color: #fbbf24; /* yellow for inline code */
        }

        pre {
            background-color: var(--surface);
            border: 1px solid var(--border);
            padding: 1.25rem;
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 1.5rem;
        }

        pre code {
            background-color: transparent;
            padding: 0;
            color: #e4e4ed;
            font-size: 0.875em;
        }

        /* Lists */
        ul, ol {
            margin-bottom: 1.5rem;
            padding-left: 1.5rem;
        }

        li {
            margin-bottom: 0.5rem;
        }

        /* Blockquotes */
        blockquote {
            border-left: 4px solid var(--accent);
            background-color: var(--surface);
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            border-radius: 0 8px 8px 0;
            color: var(--text-muted);
        }
        
        blockquote p:last-child { margin-bottom: 0; }

        /* Header nav */
        .page-header {
            margin-bottom: 3rem;
        }
        
        .nav-links {
            display: flex;
            gap: 1rem;
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }
        
        .nav-links a { color: var(--text-muted); }
        .nav-links a:hover { color: var(--text); }

        /* Custom list style like in the reference */
        ul li::marker { color: var(--text-muted); }

    </style>
</head>
<body>
    <div class="container">
        {{ content }}
    </div>
</body>
</html>
